<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonas Matemático - Sistemas</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 50px; }
        h1 { color: #333; }
        .menu { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; text-decoration: none; color: #333; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card h2 { margin-top: 0; color: #008080; }
        .card p { color: #666; }
    </style>
</head>
<body>

    <h1>Bem-vindo ao Portal Jonas Matemático</h1>
    <p>Selecione o sistema que deseja acessar:</p>

    <div class="menu">
        <a href="/omr/" class="card">
            <h2>Sistema OMR</h2>
            <p>Provas abertas, correção automática e relatórios.</p>
        </a>

        <a href="/caixa-ccb/" class="card">
            <h2>Sistema Caixa CCB</h2>
            <p>Gerenciamento e controle financeiro.</p>
        </a>
    </div>

</body>
</html>
