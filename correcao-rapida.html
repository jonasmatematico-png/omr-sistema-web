<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚀 Correção Rápida - DEBUG</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}
.container { max-width: 500px; margin: 0 auto; }
h1 { color: #00e5c7; margin-bottom: 16px; font-size: 20px; }
.btn {
    width: 100%; padding: 16px; margin: 8px 0;
    background: #00bfa5; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 700;
    cursor: pointer;
}
.btn:active { opacity: 0.8; }
.log-box {
    background: #0f0f1e; border: 2px solid #333;
    border-radius: 8px; padding: 16px; margin: 16px 0;
    font-family: monospace; font-size: 12px;
    max-height: 300px; overflow-y: auto;
    white-space: pre-wrap;
}
.log-box .success { color: #00e5c7; }
.log-box .error { color: #ff5252; }
.log-box .info { color: #ffab40; }
.status {
    background: #2a2a3e; padding: 12px; border-radius: 8px;
    margin: 12px 0; font-size: 14px;
}
#reader { width: 100%; }
#reader video { 
    width: 100% !important; height: auto !important;
    -webkit-playsinline: true; playsinline: true;
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
    <h1>🚀 Correção Rápida - DIAGNÓSTICO</h1>
    
    <div class="status" id="statusInit">⏳ Verificando ambiente...</div>
    
    <button class="btn" id="btnIniciar" onclick="iniciarScanner()">📸 INICIAR CÂMERA</button>
    
    <div id="telaScanner" class="hidden">
        <div id="reader"></div>
        <div class="status">📷 Scanner ativo - Aponte para o QR Code</div>
    </div>
    
    <div class="log-box" id="logBox">📋 Log de eventos:</div>
</div>

<script>
const SUPABASE_URL = 'https://mkqnaiuplkqiitwxltli.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcW5haXVwbGtxaWl0d3hsdGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTg5MzMsImV4cCI6MjA5OTk3NDkzM30.MtrmkMjW9ODjl7FcNw6VIu8SJTeuewwmoFeiSSvRk1U';

let logBox = null;
let scanner = null;

function log(msg, tipo = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = tipo;
    entry.textContent = `[${timestamp}] ${msg}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
    console.log(`[${tipo.toUpperCase()}] ${msg}`);
}

function setStatus(msg) {
    document.getElementById('statusInit').textContent = msg;
}

// ========================================================================
// VERIFICAÇÃO INICIAL
// ========================================================================
function verificarAmbiente() {
    logBox = document.getElementById('logBox');
    
    // 1. Verificar HTTPS
    const isHTTPS = window.location.protocol === 'https:';
    log(`Protocolo: ${window.location.protocol}`, isHTTPS ? 'success' : 'error');
    if (!isHTTPS) {
        setStatus('❌ ERRO: Câmera requer HTTPS!');
        log('⚠️ Câmera só funciona em HTTPS (exceto localhost)', 'error');
    }
    
    // 2. Verificar se Html5Qrcode foi carregado
    if (typeof Html5Qrcode === 'undefined') {
        setStatus('❌ ERRO: Biblioteca Html5Qrcode não carregou!');
        log('Biblioteca Html5Qrcode não está disponível', 'error');
        document.getElementById('btnIniciar').disabled = true;
        return;
    }
    log('✅ Biblioteca Html5Qrcode carregada', 'success');
    
    // 3. Verificar suporte a câmera
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('❌ ERRO: Navegador não suporta câmera!');
        log('navigator.mediaDevices.getUserMedia não disponível', 'error');
        document.getElementById('btnIniciar').disabled = true;
        return;
    }
    log('✅ Navegador suporta câmera', 'success');
    
    // 4. Verificar permissões
    setStatus('✅ Ambiente OK - Clique para iniciar');
    log('Ambiente verificado com sucesso', 'success');
}

// ========================================================================
// INICIAR SCANNER
// ========================================================================
async function iniciarScanner() {
    log('📸 Iniciando scanner...', 'info');
    setStatus('⏳ Solicitando permissão de câmera...');
    
    try {
        // Teste 1: Solicitar permissão manualmente primeiro
        log('Testando permissão de câmera...', 'info');
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
        });
        log('✅ Permissão concedida!', 'success');
        
        // Parar o stream de teste
        stream.getTracks().forEach(track => track.stop());
        log('Stream de teste parado', 'info');
        
        // Teste 2: Listar câmeras disponíveis
        log('Listando dispositivos de vídeo...', 'info');
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        log(`Encontradas ${videoDevices.length} câmera(s)`, 'success');
        videoDevices.forEach((d, i) => {
            log(`  Câmera ${i+1}: ${d.label || 'Sem nome'}`, 'info');
        });
        
        if (videoDevices.length === 0) {
            throw new Error('Nenhuma câmera encontrada no dispositivo');
        }
        
        // Teste 3: Iniciar scanner
        log('Criando instância do scanner...', 'info');
        scanner = new Html5Qrcode("reader");
        log('✅ Scanner criado', 'success');
        
        log('Iniciando scanner com câmera traseira...', 'info');
        setStatus('⏳ Iniciando scanner...');
        
        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            },
            (decodedText) => {
                log(`✅ QR Code detectado: ${decodedText}`, 'success');
                alert('QR Code lido: ' + decodedText);
            },
            (errorMessage) => {
                // Ignorar erros de scan contínuo (normal quando não há QR no frame)
            }
        );
        
        log('✅ Scanner iniciado com sucesso!', 'success');
        setStatus('✅ Scanner ativo');
        
        document.getElementById('btnIniciar').classList.add('hidden');
        document.getElementById('telaScanner').classList.remove('hidden');
        
    } catch (error) {
        log(`❌ ERRO: ${error.name} - ${error.message}`, 'error');
        
        let msgErro = '❌ ';
        if (error.name === 'NotAllowedError') {
            msgErro += 'Permissão negada! Vá nas configurações do navegador e permita o acesso à câmera.';
            log('O usuário negou permissão ou o site não tem permissão', 'error');
        } else if (error.name === 'NotFoundError') {
            msgErro += 'Nenhuma câmera encontrada!';
            log('Não há câmera disponível no dispositivo', 'error');
        } else if (error.name === 'NotReadableError') {
            msgErro += 'Câmera já está em uso por outro aplicativo!';
            log('A câmera está sendo usada por outro app', 'error');
        } else if (error.name === 'OverconstrainedError') {
            msgErro += 'Configuração de câmera não suportada!';
            log('As configurações solicitadas não são suportadas', 'error');
        } else {
            msgErro += `Erro desconhecido: ${error.message}`;
        }
        
        setStatus(msgErro);
        log('Stack trace: ' + error.stack, 'error');
    }
}

// Inicializar ao carregar
window.addEventListener('load', verificarAmbiente);
</script>

</body>
</html>
