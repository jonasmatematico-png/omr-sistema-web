<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🚀 Correção Rápida - OMR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f1528 0%, #1d2a4d 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
.topo { background: rgba(0,0,0,0.5); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
.topo h1 { font-size: 16px; color: #00e5c7; font-weight: 800; }
.contador { background: linear-gradient(135deg, #00bfa5, #7c4dff); padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px; }
.tela-inicio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.tela-inicio h2 { font-size: 24px; margin-bottom: 16px; color: #00e5c7; }
.tela-inicio p { font-size: 15px; color: #b388ff; margin-bottom: 28px; line-height: 1.5; max-width: 400px; }
.btn-gigante { width: 100%; max-width: 350px; padding: 22px; background: linear-gradient(135deg, #00bfa5, #00e5c7); border: none; border-radius: 16px; color: #0f1528; font-size: 19px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 24px rgba(0,229,199,0.3); margin-bottom: 12px; }
.btn-gigante.secundario { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.3); font-size: 15px; padding: 16px; }
.scanner-area { position: relative; width: 100%; flex: 1; background: #000; min-height: 55vh; }
#reader { width: 100%; height: 100%; }
#reader video { width: 100% !important; height: 100% !important; object-fit: cover; -webkit-playsinline: true; }
.status-scan { position: absolute; bottom: 76px; left: 0; right: 0; text-align: center; padding: 12px; background: rgba(0,0,0,0.7); color: #00e5c7; font-weight: 700; font-size: 14px; }
.acoes-scanner { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: rgba(0,0,0,0.85); display: flex; gap: 10px; }
.btn-acao { flex: 1; padding: 15px; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
.btn-manual { background: linear-gradient(135deg, #ff9800, #ffab40); color: #000; }
.btn-cancelar { background: rgba(255,255,255,0.15); color: #fff; }
.log-box { background: #0f0f1e; border: 1px solid #333; border-radius: 8px; padding: 10px; margin: 12px 16px; font-family: monospace; font-size: 11px; max-height: 110px; overflow-y: auto; white-space: pre-wrap; }
.log-box .ok { color: #00e5c7; } .log-box .er { color: #ff5252; } .log-box .in { color: #ffab40; }
.confirmacao { display: none; flex: 1; padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; animation: slideUp 0.3s ease-out; overflow-y: auto; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.card-aluno { background: linear-gradient(135deg, rgba(0,229,199,0.15), rgba(179,136,255,0.15)); border: 2px solid #00e5c7; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.card-aluno .label { font-size: 11px; color: #b388ff; font-weight: 800; letter-spacing: 1px; }
.card-aluno .turma { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.card-aluno .numero { display: inline-block; background: #7c4dff; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 14px; }
.card-aluno .nome { font-size: 22px; font-weight: 900; margin-top: 8px; color: #fff; text-transform: uppercase; }
.card-nota { background: #fff; color: #1d2a4d; border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; }
.nota-final { font-size: 52px; font-weight: 900; color: #00bfa5; line-height: 1; }
.nota-max { font-size: 18px; color: #888; }
.resumo-acertos { display: flex; justify-content: space-around; margin-top: 14px; }
.resumo-acertos .valor { font-size: 22px; font-weight: 800; }
.resumo-acertos .lbl { font-size: 11px; color: #666; font-weight: 700; }
.acerto { color: #00bfa5; } .erro { color: #ef5350; }
.btn-grande { width: 100%; padding: 20px; border: none; border-radius: 16px; font-size: 17px; font-weight: 900; cursor: pointer; margin-bottom: 12px; }
.btn-salvar { background: linear-gradient(135deg, #00bfa5, #00e5c7); color: #0f1528; }
.btn-refazer { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.3); }
.btn-fechar { background: linear-gradient(135deg, #7c4dff, #b388ff); color: #fff; }
.processando { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; }
.processando .spinner { width: 60px; height: 60px; border: 5px solid rgba(0,229,199,0.2); border-top-color: #00e5c7; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2a4d; color: #fff; padding: 12px 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 9999; font-weight: 700; opacity: 0; transition: opacity 0.3s; text-align: center; width: 90%; max-width: 400px; }
.toast.show { opacity: 1; } .toast.sucesso { background: linear-gradient(135deg, #00bfa5, #00e5c7); color: #0f1528; } .toast.erro { background: #ef5350; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="topo">
    <h1>🚀 Correção Rápida</h1>
    <div class="contador" id="contador">0 corrigidos</div>
</div>

<div class="tela-inicio" id="telaInicio">
    <h2>Modo Scanner Contínuo</h2>
    <p>Aponte a câmera para a prova.<br>O QR Code é detectado <strong>em qualquer lugar da tela</strong>.</p>
    <button class="btn-gigante" onclick="iniciarScanner()">📸 INICIAR CÂMERA</button>
    <button class="btn-gigante secundario" onclick="document.getElementById('inputManual').click()">🖼️ USAR FOTO MANUAL</button>
</div>

<div id="telaScanner" style="display:none; flex:1; flex-direction:column;">
    <div class="scanner-area">
        <div id="reader"></div>
        <div class="status-scan" id="statusScan">📷 Aponte para a prova...</div>
        <div class="acoes-scanner">
            <button class="btn-acao btn-manual" onclick="capturarManual()">📸 CAPTURAR AGORA</button>
            <button class="btn-acao btn-cancelar" onclick="location.reload()">✕ Cancelar</button>
        </div>
    </div>
    <div class="log-box" id="logBox"></div>
</div>

<div class="processando" id="telaProcessando">
    <div class="spinner"></div>
    <h3 style="color:#00e5c7;">Processando respostas...</h3>
</div>

<div class="confirmacao" id="telaConfirmacao">
    <div class="card-aluno">
        <div class="label">👤 ALUNO IDENTIFICADO</div>
        <div class="turma" id="confTurma">🏫 Turma</div>
        <div><span class="numero" id="confNumero">Nº 0</span></div>
        <div class="nome" id="confNome">Nome do Aluno</div>
    </div>
    <div class="card-nota">
        <div class="label" style="color:#888;">📊 RESULTADO</div>
        <div style="margin-top:8px;">
            <span class="nota-final" id="confNota">0</span>
            <span class="nota-max">/ 10</span>
        </div>
        <div class="resumo-acertos">
            <div><div class="valor acerto" id="confAcertos">0</div><div class="lbl">✅ ACERTOS</div></div>
            <div><div class="valor erro" id="confErros">0</div><div class="lbl">❌ ERROS</div></div>
            <div><div class="valor" id="confTotal" style="color:#1d2a4d;">0</div><div class="lbl">📝 QUESTÕES</div></div>
        </div>
    </div>
    <button class="btn-grande btn-salvar" onclick="salvarEProximo()">✅ SALVAR E PRÓXIMO</button>
    <button class="btn-grande btn-refazer" onclick="tirarOutra()">🔄 FOTO RUIM / TENTAR OUTRA</button>
    <button class="btn-grande btn-fechar" onclick="location.reload()">🏁 FINALIZAR</button>
</div>

<input type="file" id="inputManual" accept="image/*" capture="environment" style="display:none;" onchange="processarFotoManual(this)">
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://mkqnaiuplkqiitwxltli.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcW5haXVwbGtxaWl0d3hsdGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTg5MzMsImV4cCI6MjA5OTk3NDkzM30.MtrmkMjW9ODjl7FcNw6VIu8SJTeuewwmoFeiSSvRk1U';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const API_BACKEND = 'https://omr-backend-laboratorio.onrender.com';

let scanner = null, alunoAtual = null, resultadoAtual = null;
let corrigidosCount = 0, processando = false, ultimaDeteccao = 0;

function log(msg, tipo) {
    const box = document.getElementById('logBox');
    if (!box) return;
    const d = document.createElement('div');
    d.className = tipo || 'in';
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
}

async function iniciarScanner() {
    log('Clique em INICIAR CÂMERA', 'in');
    document.getElementById('telaInicio').style.display = 'none';
    document.getElementById('telaScanner').style.display = 'flex';
    document.getElementById('statusScan').textContent = '⏳ Solicitando câmera...';

    try {
        scanner = new Html5Qrcode("reader");
        log('Scanner criado', 'ok');

        // ✅ CONFIGURAÇÃO IDÊNTICA À VERSÃO DEBUG (que abriu a câmera!)
        // + qrbox em FUNÇÃO cobrindo ~90% da tela (pega o QR do canto)
        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                aspectRatio: 1.0,
                qrbox: function (viewfinderWidth, viewfinderHeight) {
                    const lado = Math.min(viewfinderWidth, viewfinderHeight) * 0.9;
                    return { width: lado, height: lado };
                }
            },
            onScanSuccess,
            function () {}
        );
        log('✅ Scanner ativo!', 'ok');
        document.getElementById('statusScan').textContent = '📷 Aponte para a prova...';
        showToast('📷 Câmera aberta!', 'sucesso');
    } catch (e) {
        log('❌ ' + e.name + ': ' + e.message, 'er');
        showToast('❌ ' + e.message, 'erro');
        document.getElementById('statusScan').textContent = '❌ Erro: ' + e.message;
    }
}

async function onScanSuccess(decodedText) {
    const agora = Date.now();
    if (processando || (agora - ultimaDeteccao < 3000)) return;
    ultimaDeteccao = agora;
    log('QR lido: ' + decodedText, 'ok');

    const ids = extrairIds(decodedText);
    if (!ids) { showToast('❌ QR Code inválido', 'erro'); return; }

    processando = true;
    document.getElementById('statusScan').textContent = '✅ QR detectado! Processando...';
    try {
        const video = document.querySelector('#reader video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64 = canvas.toDataURL('image/jpeg', 0.95);
        if (scanner) await scanner.pause(true);
        await processarImagem(base64, ids.idAluno, ids.idProva);
    } catch (e) {
        log('❌ ' + e.message, 'er');
        showToast('❌ ' + e.message, 'erro');
        voltarAoScanner();
    }
}

function extrairIds(texto) {
    if (texto.startsWith('OMRALUNO:')) {
        const p = texto.split(':');
        return { idProva: parseInt(p[1]), idAluno: parseInt(p[2]) };
    }
    if (texto.startsWith('OMRCARD:')) {
        return { idProva: null, idAluno: parseInt(texto.replace('OMRCARD:', '')) };
    }
    return null;
}

async function capturarManual() {
    if (processando) return;
    processando = true;
    log('CAPTURAR AGORA clicado', 'in');
    try {
        const video = document.querySelector('#reader video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64 = canvas.toDataURL('image/jpeg', 0.95);
        const qr = await lerQRdaImagem(base64);
        if (!qr) { showToast('❌ QR não visto. Aproxime e tente de novo.', 'erro'); voltarAoScanner(); return; }
        if (scanner) await scanner.pause(true);
        await processarImagem(base64, qr.idAluno, qr.idProva);
    } catch (e) {
        log('❌ ' + e.message, 'er');
        showToast('❌ ' + e.message, 'erro');
        voltarAoScanner();
    }
}

function lerQRdaImagem(base64) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = function () {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const escala = Math.min(1, 1200 / Math.max(img.width, img.height));
            canvas.width = Math.floor(img.width * escala);
            canvas.height = Math.floor(img.height * escala);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(data.data, canvas.width, canvas.height, { inversionAttempts: "attemptBoth" });
            resolve(code ? extrairIds(code.data) : null);
        };
        img.onerror = function () { resolve(null); };
        img.src = base64;
    });
}

async function processarImagem(base64, idAluno, idProva) {
    document.getElementById('telaScanner').style.display = 'none';
    document.getElementById('telaProcessando').style.display = 'flex';

    const { data: aluno } = await supabase.from('alunos')
        .select('id, nome_completo, numero_chamada, id_turma').eq('id', idAluno).single();
    if (!aluno) throw new Error('Aluno não encontrado');
    alunoAtual = aluno;

    const { data: turma } = await supabase.from('turmas').select('nome').eq('id', aluno.id_turma).single();

    if (!idProva) {
        const { data: al } = await supabase.from('avaliacoes')
            .select('id').eq('id_turma', aluno.id_turma).eq('modo_correcao', 'objetiva')
            .order('id', { ascending: false }).limit(1);
        idProva = al && al[0] ? al[0].id : null;
    }
    if (!idProva) throw new Error('Prova não identificada pelo QR');

    const response = await fetch(API_BACKEND + '/api/processar_imagem_omr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imagem: base64, id_aluno: idAluno, id_avaliacao: idProva })
    });
    const resultado = await response.json();
    if (!resultado.sucesso) throw new Error(resultado.erro || 'Erro no processamento');

    resultadoAtual = resultado;
    resultadoAtual.nomeTurma = turma ? turma.nome : 'Turma';
    resultadoAtual.idProva = idProva;
    log('✅ OMR processado. Nota: ' + resultado.nota_final, 'ok');
    mostrarConfirmacao();
}

function mostrarConfirmacao() {
    document.getElementById('telaProcessando').style.display = 'none';
    document.getElementById('telaConfirmacao').style.display = 'block';
    document.getElementById('confTurma').textContent = '🏫 ' + resultadoAtual.nomeTurma;
    document.getElementById('confNumero').textContent = 'Nº ' + (alunoAtual.numero_chamada || '?');
    document.getElementById('confNome').textContent = (alunoAtual.nome_completo || 'Aluno').toUpperCase();
    const acertos = resultadoAtual.acertos || 0;
    const total = resultadoAtual.total_questoes || 0;
    document.getElementById('confNota').textContent = (resultadoAtual.nota_final || 0).toFixed(1);
    document.getElementById('confAcertos').textContent = acertos;
    document.getElementById('confErros').textContent = total - acertos;
    document.getElementById('confTotal').textContent = total;
}

async function salvarEProximo() {
    if (!resultadoAtual || !alunoAtual) return;
    try {
        const response = await fetch(API_BACKEND + '/api/salvar_correcao_omr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id_aluno: alunoAtual.id,
                id_avaliacao: resultadoAtual.idProva,
                detalhes_respostas: resultadoAtual.detalhes_respostas || []
            })
        });
        const res = await response.json();
        if (!res.sucesso) throw new Error(res.erro || 'Falha ao salvar');
        corrigidosCount++;
        document.getElementById('contador').textContent = corrigidosCount + ' corrigidos';
        log('💾 Salvo: ' + alunoAtual.nome_completo, 'ok');
        showToast('✅ Nota ' + resultadoAtual.nota_final.toFixed(1) + ' salva!', 'sucesso');
        voltarAoScanner();
    } catch (e) { log('❌ ' + e.message, 'er'); showToast('❌ ' + e.message, 'erro'); }
}

function tirarOutra() { showToast('🔄 Aponte novamente...', 'sucesso'); voltarAoScanner(); }

async function voltarAoScanner() {
    document.getElementById('telaConfirmacao').style.display = 'none';
    document.getElementById('telaProcessando').style.display = 'none';
    document.getElementById('telaScanner').style.display = 'flex';
    document.getElementById('statusScan').textContent = '📷 Aponte para a próxima prova...';
    processando = false; alunoAtual = null; resultadoAtual = null;
    try { if (scanner) await scanner.resume(); } catch (e) {}
}

async function processarFotoManual(input) {
    if (!input.files || !input.files[0]) return;
    processando = true;
    document.getElementById('telaInicio').style.display = 'none';
    document.getElementById('telaProcessando').style.display = 'flex';
    const reader = new FileReader();
    reader.onload = async function (e) {
        try {
            const qr = await lerQRdaImagem(e.target.result);
            if (!qr) throw new Error('QR não encontrado na foto');
            await processarImagem(e.target.result, qr.idAluno, qr.idProva);
        } catch (err) {
            showToast('❌ ' + err.message, 'erro');
            setTimeout(() => location.reload(), 1500);
        }
    };
    reader.readAsDataURL(input.files[0]);
}

function showToast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (tipo || '');
    setTimeout(() => { t.className = 'toast'; }, 3000);
}
</script>
</body>
</html>
